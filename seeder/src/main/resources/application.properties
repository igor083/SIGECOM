spring.application.name=sigecom-seeder

# ===== HTTP =====
# Porta separada da aplicacao original (8080) para as duas rodarem juntas.
server.port=${SEEDER_PORT:8081}
# Ferramenta de desenvolvimento: escuta so em loopback para nao ficar exposta
# na rede. Nao ha autenticacao aqui de proposito - nunca suba isto em producao.
server.address=${SEEDER_BIND:127.0.0.1}

# ===== PostgreSQL (mesmo banco da aplicacao original) =====
spring.datasource.url=${SEEDER_DB_URL:jdbc:postgresql://localhost:5432/sigecom}
spring.datasource.username=${SEEDER_DB_USER:postgres}
spring.datasource.password=${SEEDER_DB_PASS:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# 'none' e obrigatorio: quem manda no schema da aplicacao e a aplicacao
# original (ddl-auto=update). O seeder nao toca em tabela dela.
spring.jpa.hibernate.ddl-auto=none

# Unica excecao: a tabela do proprio seeder (seed_registro), criada com
# CREATE TABLE IF NOT EXISTS. Ela nao pertence ao dominio da aplicacao.
spring.sql.init.mode=always
spring.sql.init.schema-locations=classpath:schema-seeder.sql
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== Volume dos dados gerados =====
# Janela de dias (retroativa a partir de hoje) coberta por vendas,
# lancamentos e fechamentos.
sigecom.seed.dias=${SEED_DIAS:90}
# Semente do gerador pseudoaleatorio. Fixa de proposito: o mesmo valor
# sempre produz exatamente o mesmo conjunto de dados.
sigecom.seed.random-seed=${SEED_RANDOM:20260816}
# Senha atribuida a todo usuario de teste criado pelo seeder.
sigecom.seed.senha-padrao=${SEED_SENHA:senha123}
