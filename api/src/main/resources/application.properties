# ===== PostgreSQL =====
spring.datasource.url=jdbc:postgresql://localhost:5432/sigecom
spring.datasource.username=postgres
spring.datasource.password=postgres
spring.datasource.driver-class-name=org.postgresql.Driver

# ===== JPA / Hibernate =====
# 'update' cria as tabelas uma unica vez e atualiza o schema sem apagar dados.
# Para criar do zero a cada start (apenas em DEV), troque por 'create'.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# ===== JWT =====
jwt.secret=${JWT_SECRET:dGhpcyBpcyBhIHNhbXBsZSBzZWNyZXQga2V5IGZvciBkZXZlbG9wbWVudCB1c2Ugb25seSAtIFJFUExBQ0UgSU4gUFJPRFVDVElPTg==}
jwt.expiration-ms=${JWT_EXPIRATION_MS:3600000}

# ===== Caixa =====
# Fundo de troco padrao deixado na gaveta ao fechar o caixa (SCRUM-161).
# O operador pode informar outro valor no fechamento; este e so a sugestao.
sigecom.caixa.fundo-troco=100.00
